name: Health Check Monitoring

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Allow manual triggers
  push:
    branches:
      - main
    paths:
      - 'truth-searcher/**'
      - '.github/workflows/health-check.yml'

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./truth-searcher
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run health checks
        id: health_check
        working-directory: ./truth-searcher
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          # Run health check and capture output
          python health_check.py > health_check_output.json
          
          # Parse the output
          echo "Health check completed"
          cat health_check_output.json
          
          # Extract status
          STATUS=$(python -c "import json; data=json.load(open('health_check_output.json')); print(data['status'])")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          
          # Extract response time
          RESPONSE_TIME=$(python -c "import json; data=json.load(open('health_check_output.json')); print(data['average_response_time_ms'])")
          echo "response_time=$RESPONSE_TIME" >> $GITHUB_OUTPUT
          
          # Save timestamp
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
      
      - name: Store health check results
        if: always()
        run: |
          # Create metrics directory if it doesn't exist
          mkdir -p .github/metrics
          
          # Append health check result to metrics file
          echo "${{ steps.health_check.outputs.timestamp }},${{ steps.health_check.outputs.status }},${{ steps.health_check.outputs.response_time }}" >> .github/metrics/health_checks.csv
          
          # Keep only last 30 days of data (8640 entries at 5-minute intervals)
          tail -n 8640 .github/metrics/health_checks.csv > .github/metrics/health_checks.tmp
          mv .github/metrics/health_checks.tmp .github/metrics/health_checks.csv
      
      - name: Commit health check metrics
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/metrics/health_checks.csv || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update health check metrics [skip ci]"
          git push || true
      
      - name: Check for consecutive failures
        if: steps.health_check.outputs.status != 'healthy'
        id: check_failures
        run: |
          # Check if last 2 entries are both unhealthy (true consecutive failures)
          LAST_TWO=$(tail -n 2 .github/metrics/health_checks.csv | cut -d',' -f2)
          CONSECUTIVE=0
          
          if [ "$(echo "$LAST_TWO" | wc -l)" -eq 2 ]; then
            FIRST=$(echo "$LAST_TWO" | head -n 1)
            SECOND=$(echo "$LAST_TWO" | tail -n 1)
            if [ "$FIRST" = "unhealthy" ] && [ "$SECOND" = "unhealthy" ]; then
              CONSECUTIVE=2
            fi
          fi
          
          echo "consecutive_failures=$CONSECUTIVE" >> $GITHUB_OUTPUT
      
      - name: Create alert issue on consecutive failures
        if: steps.check_failures.outputs.consecutive_failures == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Health Check Alert: System Unhealthy';
            const body = `## System Health Alert
            
            The Truth Searcher system has failed health checks for 2 consecutive intervals.
            
            **Status:** ${{ steps.health_check.outputs.status }}
            **Timestamp:** ${{ steps.health_check.outputs.timestamp }}
            **Average Response Time:** ${{ steps.health_check.outputs.response_time }}ms
            
            ### Action Required
            - Check service logs
            - Verify API keys and configurations
            - Review system resources
            - Check external service availability
            
            ### SLA Impact
            - Target SLA: 99.9%
            - Max allowed downtime: 43.8 minutes/month
            
            This issue was automatically created by the health check monitoring system.
            `;
            
            // Check if there's already an open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-alert,automated'
            });
            
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['health-alert', 'automated', 'urgent']
              });
            }
      
      - name: Fail workflow if unhealthy
        if: steps.health_check.outputs.status == 'unhealthy'
        run: |
          echo "::error::Health check failed with status: ${{ steps.health_check.outputs.status }}"
          exit 1
